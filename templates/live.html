<!DOCTYPE html>
<html>

<head>

<title>Live Earthquake Data</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-dark">

<div class="container mt-5">

<h1 class="text-center text-light mb-4">

🌍 Live Earthquake Data

</h1>

<table class="table table-bordered table-striped table-light">

<thead>

<tr>

<th>Place</th>

<th>Magnitude</th>

<th>Latitude</th>

<th>Longitude</th>

<th>Depth</th>

</tr>

</thead>

<tbody>

{% for quake in earthquakes %}

<tr>

<td>{{ quake.place }}</td>

<td>{{ quake.magnitude }}</td>

<td>{{ quake.latitude }}</td>

<td>{{ quake.longitude }}</td>

<td>{{ quake.depth }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
