<!DOCTYPE html>
<html>

<head>

<title>Prediction History</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>Prediction History</h1>

<table class="table table-bordered table-striped">

<tr>

<th>ID</th>

<th>Latitude</th>

<th>Longitude</th>

<th>Depth</th>

<th>Risk</th>

<th>Confidence</th>

<th>Timestamp</th>

</tr>

{% for row in predictions %}

<tr>

<td>{{ row.id }}</td>

<td>{{ row.latitude }}</td>

<td>{{ row.longitude }}</td>

<td>{{ row.depth }}</td>

<td>{{ row.risk }}</td>

<td>{{ row.confidence }}</td>

<td>{{ row.timestamp }}</td>

</tr>

{% endfor %}

</table>

</div>
<div class="mb-4">

<a href="/export_csv"
class="btn btn-success">

📄 Export CSV

</a>

<a href="/export_excel"
class="btn btn-primary">

📊 Export Excel

</a>

<a href="/export_pdf"
class="btn btn-danger">

📕 Export PDF

</a>

</div>

</body>
</html>
