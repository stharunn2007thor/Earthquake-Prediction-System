
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Earthquake Prediction Map</title>

    <!-- Bootstrap -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#0f172a;

            min-height:100vh;

            overflow:hidden;

        }

        /* Navbar */

        .navbar{

            background:#1e293b;

            padding:15px;

            box-shadow:0 5px 15px rgba(0,0,0,0.3);

        }

        .navbar-brand{

            color:white !important;

            font-size:1.8rem;

            font-weight:bold;

        }

        /* Map Container */

        .map-container{

            width:100%;

            height:calc(100vh - 80px);

        }

        /* Make folium map fill container */

        .map-container iframe{

            width:100%;

            height:100%;

            border:none;

        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark">

        <div class="container">

            <span class="navbar-brand">

                🌍 Earthquake Prediction Map

            </span>

            <div>

                <a href="/"
                   class="btn btn-primary me-2">

                    🏠 Home

                </a>

                <a href="/history"
                   class="btn btn-success me-2">

                    📜 History

                </a>

                <a href="/search"
                   class="btn btn-warning">

                    🔍 Search

                </a>

            </div>

        </div>

    </nav>


    <!-- Map -->

    <div class="map-container">

        {{ map_html|safe }}

    </div>

</body>

</html>
